<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>City Sim</title>
<meta http-equiv="refresh" content="0;url=./index.html">
</head><body>
<p>Opening City Sim…</p>
<script>
(function(){
  var q = location.search || '';
  if (!q) q = '?';
  if (q.charAt(0) !== '?') q = '?' + q;
  if (!/[?&]play=/.test(q)) q += (q.length > 1 ? '&' : '') + 'play=1';
  location.replace('./index.html' + q + (location.hash || ''));
})();
</script>
</body></html>
