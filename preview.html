<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OW style preview</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:10px;top:10px;color:#fff;font:12px/1.4 system-ui;text-shadow:0 1px 2px #000;opacity:.85;pointer-events:none}
</style>
</head>
<body>
<script>
(function(){
  try{ if(sessionStorage.getItem('cs.gate')!=='1'){ location.replace('./index.html'); return; } }catch(e){ location.replace('./index.html'); }
})();
</script>

<div id="hud">loading…</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const params = new URLSearchParams(location.search);
const STYLE = (params.get('style') || 'a').toLowerCase(); // a|b|c
const INTERACTIVE = params.get('play') === '1' || params.get('interactive') === '1';
const hud = document.getElementById('hud');
const W = 1280, H = 720;

const renderer = new THREE.WebGLRenderer({ antialias: STYLE !== 'c', powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
const controls = INTERACTIVE ? new OrbitControls(camera, renderer.domElement) : null;
if (controls) {
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.target.set(0, 1.2, 0);
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 3;
  controls.maxDistance = 40;
}

const clock = new THREE.Clock();
const mixers = [];
const walkers = [];
let drivingCar = null;
let composer = null;
let ready = false;
let camMode = 'wide'; // wide | close | orbit
let t0 = 0;

function setTone(style) {
  if (style === 'b') {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  } else if (style === 'a') {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  } else {
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  }
}
setTone(STYLE);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

/* In-memory + Cache API so shared cars/buildings/props stay warm across style views */
const glbMem = new Map();
const CACHE_NAME = 'cs-assets-v02';
function loadGLB(url) {
  if (glbMem.has(url)) return glbMem.get(url);
  const p = (async () => {
    let buf;
    try {
      const cache = await caches.open(CACHE_NAME);
      let res = await cache.match(url);
      if (!res) {
        res = await fetch(url);
        if (!res.ok) throw new Error(url + ' ' + res.status);
        await cache.put(url, res.clone());
      }
      buf = await res.arrayBuffer();
    } catch (e) {
      /* Cache API may be unavailable; fall through to loader */
      return new Promise((res, rej) => loader.load(url, res, undefined, rej));
    }
    return new Promise((res, rej) => loader.parse(buf, url.replace(/[^/]+$/, ''), res, rej));
  })();
  glbMem.set(url, p);
  return p;
}
function takeScene(gltf) {
  /* clone so a cached GLB can be instanced (street lights, etc.) */
  return gltf.scene.clone(true);
}

function groundY(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  return -box.min.y;
}

function enableShadows(root, cast = true, receive = true) {
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = cast;
      o.receiveShadow = receive;
      if (STYLE === 'c' && o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => { m.flatShading = true; m.needsUpdate = true; });
      }
    }
  });
}

function recolorHuman(root, shirt, pants, skin) {
  root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      const n = (m.name || '').toLowerCase();
      if (!m.color) return;
      if (/joint/i.test(n)) {
        if (shirt) m.color.copy(shirt);
        m.roughness = 0.45; m.metalness = 0.05;
      } else if (/main/i.test(n)) {
        if (skin) m.color.copy(skin);
        m.roughness = STYLE === 'b' ? 0.55 : 0.4;
        m.metalness = 0.0;
      }
      m.needsUpdate = true;
    });
  });
}
function tintBlocky(root, hueShift) {
  root.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.map) return;
    // slight per-instance color multiply for variety without breaking atlas
    o.material = o.material.clone();
    o.material.color = new THREE.Color().setHSL(hueShift, STYLE === 'c' ? 0.55 : 0.35, STYLE === 'c' ? 0.55 : 0.7);
    if (STYLE === 'a') { o.material.flatShading = false; o.material.roughness = 0.55; o.material.metalness = 0.05; }
    o.material.needsUpdate = true;
  });
}

function findAnim(clips, ...needles) {
  for (const n of needles) {
    const hit = clips.find(c => (c.name || '').toLowerCase().includes(n.toLowerCase()));
    if (hit) return hit;
  }
  return clips[0];
}

async function makePerson(kind, x, z, facing, walk) {
  let url, idleName, walkName, scale;
  const letters = ['a', 'b', 'c', 'd', 'e'];
  const casuals = ['casual_male','casual_female','casual2_male','casual2_female','casual3_male'];
  if (STYLE === 'c') {
    url = `./assets/people/blocky_opt/character_${letters[kind % 5]}.glb`;
    idleName = 'idle'; walkName = 'walk'; scale = 1.15;
  } else {
    /* A/B: Quaternius Ultimate Animated Character casuals (rigged Walk/Idle) */
    url = `./assets/people/casual_opt/${casuals[kind % casuals.length]}.glb`;
    idleName = 'Idle'; walkName = 'Walk'; scale = STYLE === 'b' ? 1.0 : 1.0;
  }
  const gltf = await loadGLB(url);
  const root = gltf.scene; /* skinned — don't clone; each person file is used once */
  root.scale.setScalar(scale);
  enableShadows(root);
  if (STYLE === 'c') {
    tintBlocky(root, (kind * 0.17) % 1);
  } else if (STYLE === 'a') {
    /* slight stylized boost */
    root.traverse(o=>{
      if(o.isMesh&&o.material){
        const mats=Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>{ m.roughness=Math.min(0.75,m.roughness??0.55); m.metalness=Math.min(0.15,m.metalness??0); m.needsUpdate=true; });
      }
    });
  }
  root.position.set(x, 0, z);
  root.rotation.y = facing;
  root.updateMatrixWorld(true);
  root.position.y = groundY(root);
  scene.add(root);

  const mixer = new THREE.AnimationMixer(root);
  const clips = gltf.animations || [];
  const clip = findAnim(clips, walk ? walkName : idleName, walk ? 'walk' : 'idle', walk ? 'Walking_A' : 'Idle');
  if (clip) {
    const a = mixer.clipAction(clip);
    a.play();
  }
  mixers.push(mixer);

  const speed = walk ? (STYLE === 'c' ? 1.4 : 1.2) : 0;
  /* pathAxis 'x' walks along sidewalk; sign = direction */
  const pathSign = Math.abs(Math.sin(facing)) > 0.5 ? Math.sign(Math.sin(facing)) : Math.sign(Math.cos(facing)) || 1;
  walkers.push({ root, mixer, speed, facing, baseX: x, baseZ: z, phase: Math.random() * 8, pathSign });
  return root;
}

async function makeCar(url, x, z, rotY, colorHex) {
  const gltf = await loadGLB(url);
  const root = takeScene(gltf);
  root.scale.setScalar(1);
  enableShadows(root);
  if (colorHex != null) {
    root.traverse(o => {
      if (o.isMesh && o.material && o.material.color) {
        const n = (o.name + (o.material.name || '')).toLowerCase();
        if (/body|chassis|hull|paint|car/i.test(n) || (!/wheel|tire|glass|window|light|chrome|rim/i.test(n) && o.material.color.getHex() !== 0x111111)) {
          // only recolor likely body materials (skip very dark = tires)
          const lum = o.material.color.r * 0.3 + o.material.color.g * 0.6 + o.material.color.b * 0.1;
          if (lum > 0.15) o.material.color.setHex(colorHex);
        }
      }
    });
  }
  root.position.set(x, 0, z);
  root.rotation.y = rotY;
  root.updateMatrixWorld(true);
  root.position.y = groundY(root);
  scene.add(root);
  return root;
}

function addStreet() {
  // Asphalt road strip
  const roadMat = new THREE.MeshStandardMaterial({
    color: STYLE === 'c' ? 0x3a3a42 : 0x2a2c32,
    roughness: 0.92, metalness: 0.05, flatShading: STYLE === 'c'
  });
  const road = new THREE.Mesh(new THREE.BoxGeometry(28, 0.08, 10), roadMat);
  road.position.set(0, 0.04, 0);
  road.receiveShadow = true;
  scene.add(road);
  // center line
  const lineMat = new THREE.MeshStandardMaterial({ color: 0xd4c84a, roughness: 0.8, flatShading: STYLE === 'c' });
  for (let i = -3; i <= 3; i++) {
    const ln = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.02, 0.18), lineMat);
    ln.position.set(i * 3.5, 0.09, 0);
    scene.add(ln);
  }
  // sidewalks
  const walkMat = new THREE.MeshStandardMaterial({
    color: STYLE === 'c' ? 0xb8b0a0 : 0x9a958c,
    roughness: 0.95, metalness: 0, flatShading: STYLE === 'c'
  });
  for (const z of [-7.2, 7.2]) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(28, 0.12, 4.2), walkMat);
    sw.position.set(0, 0.06, z);
    sw.receiveShadow = true;
    scene.add(sw);
  }
  // curb strips
  const curb = new THREE.MeshStandardMaterial({ color: 0x6e6a64, roughness: 0.9, flatShading: STYLE === 'c' });
  for (const z of [-5.05, 5.05]) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(28, 0.2, 0.25), curb);
    c.position.set(0, 0.1, z);
    c.castShadow = true; c.receiveShadow = true;
    scene.add(c);
  }
  // grass verge beyond sidewalk
  const grass = new THREE.Mesh(new THREE.BoxGeometry(40, 0.05, 40), new THREE.MeshStandardMaterial({
    color: STYLE === 'c' ? 0x4a8f3c : 0x3d6b38, roughness: 1, flatShading: STYLE === 'c'
  }));
  grass.position.y = -0.02;
  grass.receiveShadow = true;
  scene.add(grass);
}

async function addBuildings() {
  const files = [
    ['./assets/city_opt/building_a.glb', -14, -18, 0],
    ['./assets/city_opt/building_b.glb', -5, -19, 0],
    ['./assets/city_opt/building_c.glb', 5, -18, 0],
    ['./assets/city_opt/building_d.glb', 14, -19, 0],
    ['./assets/city_opt/building_e.glb', -13, 18, Math.PI],
    ['./assets/city_opt/building_f.glb', 0, 19, Math.PI],
    ['./assets/city_opt/building_type_a.glb', 13, 18, Math.PI],
  ];
  for (const [url, x, z, rot] of files) {
    try {
      const g = await loadGLB(url);
      const r = takeScene(g);
      /* Kenney commercial buildings are tiled small — scale to street height */
      r.scale.setScalar(8);
      enableShadows(r);
      r.position.set(x, 0, z);
      r.rotation.y = rot;
      r.updateMatrixWorld(true);
      r.position.y = groundY(r);
      scene.add(r);
    } catch (e) { console.warn('bldg', url, e); }
  }
}

async function addLightsProps() {
  for (const [x, z] of [[-8, -5.4], [8, -5.4], [-8, 5.4], [8, 5.4]]) {
    try {
      const g = await loadGLB('./assets/city_opt/light_curved.glb');
      const r = takeScene(g);
      r.scale.setScalar(2.5);
      enableShadows(r, true, true);
      r.position.set(x, 0, z);
      r.rotation.y = z > 0 ? Math.PI : 0;
      r.updateMatrixWorld(true);
      r.position.y = groundY(r);
      scene.add(r);
      const pl = new THREE.PointLight(0xffc070, STYLE === 'b' ? 6 : 9, 16, 2);
      pl.position.set(x, 5.5, z);
      pl.castShadow = false;
      scene.add(pl);
    } catch (e) {}
  }
  try {
    const t = await loadGLB('./assets/city_opt/tree_small.glb');
    for (const [x, z] of [[-13, 8], [13, -8], [13, 8]]) {
      const r = t.scene.clone(true);
      enableShadows(r);
      r.position.set(x, 0, z);
      r.updateMatrixWorld(true);
      r.position.y = groundY(r);
      scene.add(r);
    }
  } catch (e) {}
}

function setupLighting() {
  scene.background = new THREE.Color(STYLE === 'c' ? 0x87b7e0 : 0xffc9a0);
  scene.fog = new THREE.Fog(STYLE === 'c' ? 0x87b7e0 : 0xffc9a0, 28, 70);

  const hemi = new THREE.HemisphereLight(
    STYLE === 'c' ? 0xdfefff : 0xffe6d0,
    STYLE === 'c' ? 0x4a6a3a : 0x4a5540,
    STYLE === 'b' ? 0.85 : 1.05
  );
  scene.add(hemi);
  /* soft fill from camera side so faces/clothes read in close-ups */
  const fill = new THREE.DirectionalLight(0xfff0e4, STYLE === 'b' ? 0.55 : 0.7);
  fill.position.set(6, 8, 14);
  scene.add(fill);

  const sun = new THREE.DirectionalLight(STYLE === 'c' ? 0xfff2d6 : 0xffd0a0, STYLE === 'b' ? 1.9 : 2.2);
  sun.position.set(-18, 22, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 60;
  sun.shadow.camera.left = -25;
  sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25;
  sun.shadow.camera.bottom = -25;
  sun.shadow.bias = -0.0002;
  scene.add(sun);

  // golden rim
  const rim = new THREE.DirectionalLight(0xff8844, STYLE === 'a' ? 0.55 : 0.35);
  rim.position.set(12, 6, -10);
  scene.add(rim);

  if (STYLE === 'a' || STYLE === 'b') {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), STYLE === 'a' ? 0.28 : 0.18, 0.6, 0.85);
    composer.addPass(bloom);
    composer.addPass(new SMAAPass(W, H));
    composer.addPass(new OutputPass());
  }
}

function setCamera(mode) {
  camMode = mode;
  if (mode === 'wide') {
    camera.position.set(14, 9, 16);
    camera.lookAt(0, 1.2, 0);
  } else if (mode === 'close') {
    camera.position.set(-1.5, 1.55, -2.8);
    camera.lookAt(-2.5, 1.15, -7.0);
  } else {
    // orbit handled in tick
  }
}

function camOrbit(t) {
  const r = 15;
  const ang = -0.35 + t * 0.08;
  camera.position.set(Math.sin(ang) * r, 7.5, Math.cos(ang) * r);
  camera.lookAt(0, 1.3, 0);
}

let started = false;
async function build() {
  hud.textContent = `loading style ${STYLE.toUpperCase()}…`;
  setupLighting();
  addStreet();
  setCamera('wide');
  if (INTERACTIVE && controls) { controls.target.set(0, 1.2, 0); controls.update(); }
  t0 = performance.now() / 1000;
  started = true;
  requestAnimationFrame(loop); /* street / first frame ASAP */

  await addBuildings();
  await addLightsProps();

  // Cars stream in first (shared, smaller), then this style's people only
  await makeCar('./assets/cars_opt/sedan.glb', -7, 2.6, Math.PI / 2, 0x2a5fcf);
  await makeCar('./assets/cars_opt/suv.glb', 6.5, -2.5, -Math.PI / 2, 0xc0c4ca);
  drivingCar = await makeCar('./assets/cars_opt/taxi.glb', -14, 0.2, Math.PI / 2, 0xe6c200);

  if (STYLE === 'c') {
    await makePerson(0, -6, -7.0, Math.PI / 2, true);
    await makePerson(1, -2, -7.3, Math.PI / 2, true);
    await makePerson(2, 2, -6.8, Math.PI / 2, true);
    await makePerson(3, 5.5, 7.0, -Math.PI / 2, true);
    await makePerson(4, -4, 7.2, Math.PI, false);
  } else {
    await makePerson(0, -6, -7.0, Math.PI / 2, true);
    await makePerson(1, -1.5, -7.25, Math.PI / 2, true);
    await makePerson(2, 3, -6.9, Math.PI / 2, true);
    await makePerson(3, 6, 7.1, -Math.PI / 2, true);
    await makePerson(4, -5, 7.15, Math.PI, false);
  }

  setCamera('wide');
  ready = true;
  window.__OW = {
    ready: true,
    style: STYLE,
    setCam: setCamera,
    getCam: () => camMode,
    freeze(v){ frozen=!!v; },
    seek(t) { frozen=true; tickFixed(t); renderOnce(); }
  };
  hud.textContent = INTERACTIVE
    ? `Style ${STYLE.toUpperCase()} · drag to look · scroll zoom · Esc/menu via back`
    : `style ${STYLE.toUpperCase()} ready`;
  if (INTERACTIVE && controls) { controls.target.set(0, 1.2, 0); controls.update(); }
}

let last = 0;
function tickFixed(t) {
  // absolute time (seconds) — set mixer time directly so seeks are stable
  for (const m of mixers) { m.setTime(Math.max(0, t)); }
  last = t;
  for (const w of walkers) {
    if (w.speed <= 0) continue;
    const span = 16;
    const u = ((t * w.speed + w.phase) % span + span) % span;
    w.root.position.x = w.pathSign > 0 ? (-8 + u) : (8 - u);
    w.root.position.z = w.baseZ;
    w.root.rotation.y = w.pathSign > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
  if (drivingCar) {
    drivingCar.position.x = -16 + ((t * 5.5) % 34);
    drivingCar.position.z = 0.2;
  }
  if (camMode === 'orbit' && !INTERACTIVE) camOrbit(t);
}

let frozen = false;
function renderOnce(){ if (composer) composer.render(); else renderer.render(scene, camera); }
function loop() {
  requestAnimationFrame(loop);
  if (!started) return;
  if (!frozen) {
    const t = performance.now() / 1000 - t0;
    tickFixed(t);
  }
  if (controls) controls.update();
  renderOnce();
}
window.__OW_HOOKS = { freeze(v){ frozen=!!v; }, renderOnce };

if (INTERACTIVE) {
  const onR = () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (composer) composer.setSize(w, h);
  };
  window.addEventListener('resize', onR); onR();
}
build().catch(e => { hud.textContent = 'ERR ' + e; console.error(e); window.__OW = { ready: false, err: String(e) }; });
</script>
</body>
</html>
